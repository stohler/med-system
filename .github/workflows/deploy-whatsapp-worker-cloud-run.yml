name: Deploy WhatsApp Worker to Cloud Run

on:
  push:
    branches:
      - main
      - cursor/sistema-de-gest-o-cl-nica-2da0
    paths:
      - "whatsapp-worker/**"
      - ".github/workflows/deploy-whatsapp-worker-cloud-run.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION != '' && secrets.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPO != '' && secrets.GCP_ARTIFACT_REPO || 'med-system' }}
  CLOUD_RUN_SERVICE: ${{ secrets.GCP_WHATSAPP_WORKER_SERVICE_NAME != '' && secrets.GCP_WHATSAPP_WORKER_SERVICE_NAME || 'med-system-whatsapp-worker' }}
  IMAGE_NAME: med-system-whatsapp-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Validate deploy variables
        run: |
          set -euo pipefail
          for var in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE; do
            if [ -z "${!var}" ]; then
              echo "Variavel obrigatoria ausente: $var"
              exit 1
            fi
          done

      - name: Build and push worker image
        run: |
          GAR_REPO_CLEAN="${{ env.GAR_REPOSITORY }}"
          GAR_REPO_CLEAN="${GAR_REPO_CLEAN#/}"
          GAR_REPO_CLEAN="${GAR_REPO_CLEAN%/}"
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${GAR_REPO_CLEAN}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "${IMAGE_URI}" ./whatsapp-worker
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Generate runtime env file
        run: |
          cat > runtime-env.yaml << 'EOF'
          NODE_ENV: "production"
          WHATSAPP_MODE: "web"
          WHATSAPP_ENABLED: "true"
          WHATSAPP_WEB_ENABLED: "true"
          WHATSAPP_SESSION_PATH: "/tmp/.wwebjs_auth"
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
          WHATSAPP_INIT_TIMEOUT_MS: "180000"
          WHATSAPP_WORKER_TOKEN: "${{ secrets.WHATSAPP_WORKER_TOKEN }}"
          WHATSAPP_BUSINESS_TOKEN: "${{ secrets.WHATSAPP_BUSINESS_TOKEN }}"
          WHATSAPP_PHONE_NUMBER_ID: "${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${{ env.IMAGE_URI }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --concurrency 1 \
            --timeout 900 \
            --env-vars-file runtime-env.yaml
