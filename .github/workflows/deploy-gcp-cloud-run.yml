name: Deploy backend to Cloud Run

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/deploy-gcp-cloud-run.yml"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch ou tag para deploy manual (opcional)"
        required: false
        type: string

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION != '' && secrets.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPO != '' && secrets.GCP_ARTIFACT_REPO || 'med-system' }}
  CLOUD_RUN_SERVICE: ${{ secrets.GCP_SERVICE_NAME != '' && secrets.GCP_SERVICE_NAME || 'med-system-api' }}
  IMAGE_NAME: med-system-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref_name }}

      - name: Resolve source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Validate deploy variables
        run: |
          set -euo pipefail
          for var in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE; do
            if [ -z "${!var}" ]; then
              echo "Variavel obrigatoria ausente: $var"
              exit 1
            fi
          done

      - name: Build and push backend image
        run: |
          GAR_REPO_CLEAN="${{ env.GAR_REPOSITORY }}"
          GAR_REPO_CLEAN="${GAR_REPO_CLEAN#/}"
          GAR_REPO_CLEAN="${GAR_REPO_CLEAN%/}"
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${GAR_REPO_CLEAN}/${{ env.IMAGE_NAME }}:${{ env.SOURCE_SHA }}"
          docker build -t "${IMAGE_URI}" ./backend
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Generate runtime env file
        run: |
          cat > runtime-env.yaml << 'EOF'
          NODE_ENV: "production"
          WHATSAPP_MODE: "web"
          WHATSAPP_ENABLED: "true"
          WHATSAPP_WEB_ENABLED: "true"
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
          WHATSAPP_INIT_TIMEOUT_MS: "120000"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          MONGODB_URI: "${{ secrets.MONGODB_URI }}"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          JWT_EXPIRES_IN: "${{ secrets.JWT_EXPIRES_IN }}"
          ENCRYPTION_KEY: "${{ secrets.ENCRYPTION_KEY }}"
          SMTP_USER: "${{ secrets.SMTP_USER }}"
          SMTP_PASS: "${{ secrets.SMTP_PASS }}"
          SMTP_FROM: "${{ secrets.SMTP_FROM }}"
          GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_REDIRECT_URI: "${{ secrets.GOOGLE_REDIRECT_URI }}"
          GOOGLE_CALENDAR_ID: "${{ secrets.GOOGLE_CALENDAR_ID }}"
          FRONTEND_ORIGIN: "${{ secrets.FRONTEND_ORIGIN }}"
          WHATSAPP_SERVICE_BASE_URL: "${{ secrets.WHATSAPP_SERVICE_BASE_URL != '' && secrets.WHATSAPP_SERVICE_BASE_URL || 'https://api-sandbox.moneri.com.br/v1/whatsapp-service' }}"
          WHATSAPP_SERVICE_TOKEN: "${{ secrets.WHATSAPP_SERVICE_TOKEN }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${{ env.IMAGE_URI }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 1 \
            --env-vars-file runtime-env.yaml
