name: Deploy frontend to Cloud Run

on:
  push:
    branches:
      - main
      - develop
      - cursor/sistema-de-gest-o-cl-nica-2da0
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-cloud-run.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION != '' && secrets.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPO != '' && secrets.GCP_ARTIFACT_REPO || 'med-system' }}
  CLOUD_RUN_SERVICE: ${{ secrets.GCP_FRONTEND_SERVICE_NAME != '' && secrets.GCP_FRONTEND_SERVICE_NAME || 'med-system-web' }}
  IMAGE_NAME: med-system-frontend
  FRONTEND_PUBLIC_HOST: ${{ secrets.FRONTEND_PUBLIC_HOST != '' && secrets.FRONTEND_PUBLIC_HOST || 'med.stohler.com.br' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Validate deploy variables
        run: |
          set -euo pipefail
          for var in GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY CLOUD_RUN_SERVICE; do
            if [ -z "${!var}" ]; then
              echo "Variavel obrigatoria ausente: $var"
              exit 1
            fi
          done
          if [ -z "${{ secrets.FRONTEND_API_URL }}" ]; then
            echo "Secret obrigatoria ausente: FRONTEND_API_URL"
            exit 1
          fi

      - name: Build and push frontend image
        run: |
          GAR_REPO_CLEAN="${{ env.GAR_REPOSITORY }}"
          GAR_REPO_CLEAN="${GAR_REPO_CLEAN#/}"
          GAR_REPO_CLEAN="${GAR_REPO_CLEAN%/}"
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${GAR_REPO_CLEAN}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_URL="${{ secrets.FRONTEND_API_URL }}" \
            --build-arg VITE_ALLOWED_HOSTS="${{ env.FRONTEND_PUBLIC_HOST }},.run.app" \
            -t "${IMAGE_URI}" \
            ./frontend
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${{ env.IMAGE_URI }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1
