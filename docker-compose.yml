version: "3.9"

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: node:22
    working_dir: /app
    command: bash -lc "npm install && npm run dev"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  frontend:
    image: node:22
    working_dir: /app
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
